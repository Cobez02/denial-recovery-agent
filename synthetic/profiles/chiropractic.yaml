    letter: >-
      The physical medicine service on line {line_number} ({procedure_code}) was billed without the
      therapy modifier this plan requires on physical medicine and rehabilitation codes. {carc_quote}
      {rarc_quote} Submit a corrected claim with the required modifier.

  - id: modifier_25_missing_em_with_cmt
    description: An established patient's E/M billed with same-day CMT without modifier 25 while the notes document a separately identifiable new complaint (typical, 97/N626).
    category: modifier
    expected_action: corrected_claim

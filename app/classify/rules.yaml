# Classification rules: CARC/RARC combinations -> denial category (docs/SPEC.md section 7).
#
# This file is an ORDERED list. For each denial reason the engine walks the list top to bottom
# and the first rule whose `match` block fits wins. A reason that matches nothing becomes
# `other` at confidence 0.30 (rule id "unmatched"). Keep specific rules (CARC + RARC) above
# generic ones (CARC only), generic CARC rules above RARC-only rules, and weak defaults last.
#
# Rule shape:
#   id:          unique snake_case identifier, recorded on the work item as rule_id
#   category:    one of the app.enums.DenialCategory values
#   confidence:  0.0 - 1.0; below CLASSIFY_MODEL_THRESHOLD (0.75) the model is consulted
#   match:
#     carc:            list of CARCs; "*" or omitted = any CARC
#     rarc_any:        at least one of these RARCs must be present (optional)
#     rarc_none:       none of these RARCs may be present (optional)
#     group:           CAS group codes allowed, e.g. [CO, PI, OA] (optional, default any)
#     level:           claim | line | any (optional, default any)
#     claim_paid:      true = the remittance paid something on the claim, false = it paid 0.00
#                      (optional; needs the remittance context, otherwise the rule does not match)
#     amount_positive: true = the adjustment amount must be > 0 (optional)
#     procedure_codes: the denied line's procedure code must be one of these codes or inside one of
#                      these inclusive numeric ranges, e.g. ["98940-98942", "G0283"] (optional;
#                      a claim-level reason has no line and never matches)
#     modifiers_any:   at least one of these modifiers must be on the denied line (optional)
#     modifiers_none:  none of these modifiers may be on the denied line (optional)
#   rationale:   short clause shown to the reviewer after the code citation, e.g.
#                "CO-16 with RARC M119 on line 1 ($120.00): missing or invalid NDC"
#
# RARC matching tries the reason's own remark codes first; the claim-level remark codes of the
# remittance (a remark after the CLP applies to the whole claim) are added when the reason's own
# codes did not select a remark-specific rule. The rationale cites both sets.
#
# Specialty: chiropractic (docs/SPECIALTY.md). The line-aware rules at the top of the file tell the
# chiropractic uses of CARC 50 apart: a CMT line without AT (a modifier problem), a GZ line (an
# expected, provider-liable denial) and a PR-group line (the patient's share under an ABN).
# Extend this file with the coder session (Phase 0) and with every shadow-mode disagreement.

# ---------------------------------------------------------------------------------------------
# Line-aware chiropractic rules: the same CARC means different things depending on the line
# ---------------------------------------------------------------------------------------------

- id: contractual_50_expected_denial_gz
  category: contractual
  confidence: 0.90
  match: {carc: ["50"], group: ["CO", "PI", "OA"], modifiers_any: ["GZ"]}
  rationale: "modifier GZ: the provider expected this item to be denied as not reasonable and necessary and holds no ABN; provider liable, not appealable"

- id: patient_responsibility_50_abn
  category: patient_responsibility
  confidence: 0.85
  match: {carc: ["50"], group: ["PR"]}
  rationale: "not medically necessary under the payer's policy and assigned to the patient (an ABN or GA on file); bill the patient per the notice"

# The automated no-AT edit carries N115 or no remark. A review organization's finding (N10), a
# missing medical record (M127) or an unsupported level of service (M25) is a medical-necessity
# review whatever the modifiers (a commercial plan's UM vendor reviews CMT lines that never carry
# AT), so those fall through to medical_necessity_core.
- id: modifier_50_cmt_without_at
  category: modifier
  confidence: 0.85
  match: {carc: ["50"], procedure_codes: ["98940-98942"], modifiers_none: ["AT", "GA", "GY", "GZ", "GX"], rarc_none: ["N10", "M127", "M25"]}
  rationale: "spinal manipulation billed without modifier AT is adjudicated as maintenance therapy; add AT when the notes document active, corrective treatment"

- id: patient_responsibility_170_provider_type_pr
  category: patient_responsibility
  confidence: 0.85
  match: {carc: ["170"], group: ["PR"]}
  rationale: "service not payable when performed by this provider type and assigned to the patient (a statutory exclusion); bill the patient, no payer action"


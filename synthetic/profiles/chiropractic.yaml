      {original_payer_ccn}. {carc_quote} {rarc_quote} No additional payment is due; the original
      determination stands.

  - id: duplicate_second_cmt_same_day
    description: A second spinal manipulation the same day after a new injury, billed as a second line of the CMT code; spinal CMT is payable once per patient per day, so the denial stands although the notes document two encounters (typical, 18/M86; Premera CP.PP.390, ND Medicaid).
    category: duplicate
    expected_action: no_action
    weight: 3
    carc: "18"
    rarcs: ["M86"]
    group: CO
    level: line
    target: {kinds: [cmt]}

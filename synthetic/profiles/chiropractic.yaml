        electronically on {submission_date}; the clearinghouse acceptance report (batch
        {clearinghouse_batch}) is on file and shows acceptance by {payer_name}.
      - >-
        Billing note: no rejection was ever received for claim {claim_control_number}; the
        clearinghouse batch {clearinghouse_batch} acceptance report dated {submission_date} is attached
        to the account.
    letter: >-
      The claim was received after the plan's filing limit of {timely_filing_days} days from the date
      of service. {carc_quote}

  - id: med_nec_maintenance_review
    description: CMT with AT judged maintenance therapy on medical review while the notes document active treatment with measurable improvement (documented, 50/N115; allowed-amount rule).
    category: medical_necessity
    expected_action: appeal
    weight: 7

# Install once: `uv run pre-commit install` (scripts/bootstrap.* do it when pre-commit is available).
# gitleaks runs before every commit so a real key or token never reaches the repository.
# The ruff rev is kept in step with the ruff pinned in uv.lock, so the hook and CI agree.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

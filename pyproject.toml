[project]
name = "denial-agent"
version = "0.1.0"
description = "Denial Recovery Agent - local MVP: reads X12 835 remittances and claim exports, classifies denials, proposes fixes, drafts appeals, and tracks outcomes with a human approving every action."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "anthropic>=2.3,<3",
    "pyotp>=2.9",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
    "rq>=2.0,<4",
    "redis>=5",
    "qrcode>=7.4",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
denial-agent = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "live_llm: tests that call the real model API (skipped without ANTHROPIC_API_KEY and LLM_PROVIDER=anthropic)",
    "slow: slow end-to-end tests",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

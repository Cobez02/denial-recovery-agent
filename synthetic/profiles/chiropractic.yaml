# Denial scenarios. level: claim | line. amount: full (whole charge denied with the CARC) or allowed
# (CO-45 contractual on the non-allowed part, the CARC on the allowed part). target picks the denied
# line; requires_tags restricts the encounter; requires_payers restricts the payer; claim_setup
# alters the claim before adjudication. Ground truth = category + expected_action. Notes are what
# the clinic would supply; letters are what the payer would send (untrusted data). "documented" and
# "typical" in a description say whether the research shows the exact code pair (docs/SPECIALTY.md).
scenarios:
  - id: elig_coverage_terminated
    description: Coverage ended before the date of service; claim denied in full (documented, 27/N30).
    category: eligibility
    expected_action: clinic_question
    weight: 6
    carc: "27"
    rarcs: ["N30"]
    group: CO
    level: claim
    letter: >-
      Our records show that the member's coverage under this plan ended before the date of service
      shown above. {carc_quote} {rarc_quote} Please verify the member's current coverage and submit
      the claim to the responsible carrier.

  - id: elig_ma_enrollee_billed_to_medicare
    description: The beneficiary was enrolled in a Medicare Advantage plan on the date of service; Part B denies as covered under a managed care plan and the letter names the plan (documented, 24).
    category: eligibility
    expected_action: corrected_claim
    weight: 4
    carc: "24"
    rarcs: []
    group: CO
    level: claim
    requires_payers: [GBMB1]
    other_payer: GPMA2
    letter_required: true
    letter: >-
      Our records show that the beneficiary was enrolled in a Medicare Advantage plan on the date of
      service, so Medicare Part B cannot pay this claim. {carc_quote} The responsible plan is
      {other_payer_name}. Please submit the claim to {other_payer_name} under that plan's member
      identifier.

  - id: auth_ma_plan_of_care_absent
    description: Medicare Advantage therapy program; a visit after the first six in the episode, the plan of care was never authorized and the notes document the plan and the progress (typical, 197/N54).
    category: authorization
    expected_action: appeal
    weight: 5
    carc: "197"
    rarcs: ["N54"]
    group: CO
    level: line
    target: {kinds: [cmt]}
    requires_tags: [follow_up]
    requires_payers: [GPMA2]
    claim_setup: {prior_auth: absent}
    note_count: [2, 3]
    notes:
      - >-
        Visit {pa_visit_number} of the planned {plan_visits}: {first_name} {last_name} reports
        {diagnosis} ({diagnosis_code}) with pain {pain_now}/10 today, down from {pain_initial}/10 at
        the initial examination on {initial_treatment_date}. Treatment plan: {plan_frequency} for
        {plan_weeks} weeks with the goal of returning to {goal_activity} without pain; continued care
        is medically necessary because objective improvement is still being measured.
      - >-
        Plan of care on file since {initial_treatment_date}: {cmt_description} ({cmt_code}),
        {plan_frequency} for {plan_weeks} weeks, re-examination every {reexam_visits} visits with pain
        scale, range of motion and functional outcome scores. The authorization request for the
        visits beyond the initial six was not transmitted by the front desk; the clinical need for
        continued care is documented at every visit.
      - >-
        Objective findings today: {lesion} at {site}; range of motion deficit {rom_now} percent,
        improved from {rom_initial} percent. The patient required continued manipulation to reach
        the stated functional goals and the care could not be interrupted to wait for a plan-of-care
        authorization.
    letter: >-
      No authorization for the plan of care was on file for the service on line {line_number}
      ({procedure_code}). {carc_quote} {rarc_quote} Treatment beyond the initial six visits in an
      eight-week episode requires an authorized plan of care; a retrospective review may be requested
      within the appeal period with the plan of care and the progress notes.

  - id: auth_number_not_on_claim
    description: The vendor's or program's authorization exists on the claim record but was not transmitted; CARC 15 is deactivated, so 16 with M62 (typical).
    category: authorization
    expected_action: corrected_claim
    weight: 4
    carc: "16"
    rarcs: ["M62"]
    group: CO
    level: claim
    requires_payers: [GPMA2, SWPPO3, TLMC4]
    claim_setup: {prior_auth: present}
    note_count: [1, 1]
    notes:
      - >-
        Billing note: authorization {prior_auth_number} was obtained from {payer_name} on {auth_date}
        for the plan of care covering {cmt_description} ({cmt_code}); the approval is on file in the
        chart and was not transmitted in the authorization field of the claim.
    letter: >-
      The claim did not include a valid authorization reference for the services billed. {carc_quote}
      {rarc_quote} If an authorization was obtained, submit a corrected claim that includes the
      authorization number.

  - id: auth_medicaid_service_limit
    description: More than the 20 manipulations per calendar year the program covers without a service authorization; the visit note on file says nothing about whether one was requested (typical, 119/N640).
    category: authorization
    expected_action: clinic_question
    weight: 4
    carc: "119"
    rarcs: ["N640"]
    group: CO
    level: line
    target: {kinds: [cmt]}
    requires_tags: [follow_up]
    requires_payers: [TLMC4]
    claim_setup: {prior_auth: absent}
    note_count: [1, 1]
    notes:
      - >-
        Visit note, {service_date}: {cmt_description}, {cmt_detail}, for {diagnosis}
        ({diagnosis_code}); pain {pain_now}/10. The patient continues the plan of care,
        {plan_frequency}.
    letter: >-
      The spinal manipulation on line {line_number} ({procedure_code}) exceeds the 20 manipulations
      per calendar year this program covers without a service authorization. {carc_quote}
      {rarc_quote} Submit a service limits authorization request for visits beyond the limit.

  - id: modifier_at_missing
    description: Spinal CMT billed without modifier AT is adjudicated as maintenance therapy although the notes document active, corrective treatment (documented, 50/N115).
    category: modifier
    expected_action: corrected_claim
    weight: 7
    carc: "50"
    rarcs: ["N115"]
    group: CO
    level: line
    target: {kinds: [cmt]}
    requires_tags: [follow_up]
    requires_payers: [GBMB1, GPMA2]
    claim_setup: {strip_target_modifiers: [AT]}
    note_count: [3, 3]
    notes:
      - >-
        {service_date}, visit {visit_number} of {plan_visits}: active treatment of {diagnosis}
        ({diagnosis_code}). Subjective: pain {pain_now}/10 (initial {pain_initial}/10 on
        {initial_treatment_date}). PART findings: tenderness and asymmetry at {site} with {lesion};
        range of motion restricted {rom_now} percent (initially {rom_initial} percent). Assessment:
        measurable improvement toward the treatment plan goals; the subluxation at {site} remains
        clinically significant. Plan: {cmt_description}, {cmt_detail}; continue {plan_frequency}.
      - >-
        Treatment plan established on {initial_treatment_date}: corrective care {plan_frequency} for
        {plan_weeks} weeks, goals of pain below 3/10, full range of motion and return to
        {goal_activity}, measured by pain scale, range of motion and outcome score at each
        re-examination. Today's visit is active, corrective treatment under that plan, not
        maintenance care.
      - >-
        Segments adjusted today with {technique} technique: {cmt_detail}. Re-examination outcome
        score improved from {oswestry_initial} to {oswestry_now} percent disability since the start
        of care; continued improvement is expected.
    letter: >-
      The spinal manipulation on line {line_number} ({procedure_code}) was billed without the
      modifier that identifies active or corrective treatment and was processed as maintenance
      therapy, which is not covered. {carc_quote} {rarc_quote}

  - id: modifier_at_missing_maintenance_care
    description: Spinal CMT billed without AT for a patient whose notes document maintenance (supportive) care; AT must never be added to maintenance care, so the denial stands (documented, 50/N115; BPM ch. 15 sec. 240.1.3).
    category: modifier
    expected_action: no_action
    weight: 3
    carc: "50"
    rarcs: ["N115"]
    group: CO
    level: line
    target: {kinds: [cmt]}
    requires_tags: [cmt_only]
    requires_payers: [GBMB1, GPMA2]
    claim_setup: {strip_target_modifiers: [AT]}
    note_count: [2, 2]
    notes:
      - >-
        Supportive care visit: {first_name} {last_name} is clinically stable with {diagnosis}
        ({diagnosis_code}); findings unchanged since the last visit and no further objective
        improvement is expected. Monthly visits continue to prevent deterioration.
      - >-
        No Advance Beneficiary Notice is on file for these visits. Procedure: {cmt_description},
        {cmt_detail}.
    letter: >-
      The spinal manipulation on line {line_number} ({procedure_code}) was billed without the
      modifier that identifies active or corrective treatment and was processed as maintenance
      therapy, which is not covered. {carc_quote} {rarc_quote}

  - id: modifier_gp_missing
    description: A physical medicine line billed without the GP therapy modifier the plan requires; M78 is deactivated, so 4 with N822 (typical).
    category: modifier
    expected_action: corrected_claim

      {timely_filing_days} days from the date of service. {carc_quote}

  - id: timely_filing_in_window
    description: The payer denied for timely filing although the claim was accepted inside the window; the clearinghouse report is the proof (documented, 29; not the Medicare contractor, whose timely-filing denials carry no appeal rights).
    category: timely_filing
    expected_action: appeal
    weight: 3
    carc: "29"
    rarcs: []
    group: CO
    level: claim
    requires_payers: [GPMA2, SWPPO3, TLMC4]
    claim_setup: {timely_filing: inside}
    note_count: [1, 2]
    notes:

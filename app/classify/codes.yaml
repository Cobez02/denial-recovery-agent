# CARC / RARC catalog (docs/SPEC.md section 4.3).
#
# Short, human-readable text for every Claim Adjustment Reason Code (CARC) and Remittance
# Advice Remark Code (RARC) used by app/classify/rules.yaml and the synthetic generator.
# Texts are paraphrased from the public X12 code lists; citations in proposals use them.
#
# Keys are quoted strings on purpose: YAML would otherwise read "16" as an integer.
# Add codes freely; tests/test_codes.py checks that every code referenced by a rule is here.

carc:
  "1": "Deductible amount applied."
  "2": "Coinsurance amount applied."
  "3": "Co-payment amount applied."
  "4": "Procedure code is inconsistent with the modifier used, or a required modifier is missing."
  "5": "Procedure code or type of bill is inconsistent with the place of service."
  "6": "Procedure or revenue code is inconsistent with the patient's age."
  "11": "Diagnosis is inconsistent with the procedure."
  "15": "Authorization number is missing, invalid, or does not apply to the billed services or provider."
  "16": "Claim or service lacks information or has a submission/billing error; a remark code identifies what is missing."
  "18": "Exact duplicate of a claim or service already processed."
  "22": "Care may be covered by another payer under coordination of benefits."
  "23": "Impact of a prior payer's adjudication, including payments and adjustments."
  "26": "Expenses were incurred before coverage began."

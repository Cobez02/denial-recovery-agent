# Profile-defined placeholders for the notes, drawn once per claim in this order: a list is a choice,
# {range: [lo, hi]} an integer (a bound may name an earlier integer placeholder), {days_before_service:
# [lo, hi]} an ISO date that many days before the date of service, {bundle: [...]} one mapping whose
# placeholders are drawn together (a plan's frequency, length, visit count and re-examination interval
# always agree: 3 x 2 + 2 x 4 = 14 visits).
vocabulary:
  plan:
    bundle:
      - {plan_frequency: "three times a week for two weeks, then twice a week", plan_weeks: "6", plan_visits: "14", reexam_visits: "6"}
      - {plan_frequency: "twice a week", plan_weeks: "4", plan_visits: "8", reexam_visits: "8"}
      - {plan_frequency: "twice a week", plan_weeks: "6", plan_visits: "12", reexam_visits: "6"}
      - {plan_frequency: "three times a week", plan_weeks: "4", plan_visits: "12", reexam_visits: "6"}
  # the visit within the plan; a visit after the first six (the MA plan's review point); the clinic's
  # own count of the calendar year's visits (below the PPO's 20-visit benefit)
  visit_number: {range: [3, plan_visits]}
  pa_visit_number: {range: [7, plan_visits]}
  year_visit_count: {range: [9, 19]}
  pain_initial: {range: [7, 9]}
  pain_now: {range: [2, 5]}
  rom_initial: {range: [35, 55]}
  rom_now: {range: [10, 25]}
  oswestry_initial: {range: [44, 62]}
  oswestry_now: {range: [18, 32]}
  ndi_initial: {range: [38, 56]}
  ndi_now: {range: [14, 28]}
  initial_treatment_date: {days_before_service: [10, 42]}
  onset_date: {days_before_service: [43, 84]}
  mechanism:
    - "lifting a heavy box"
    - "a rear-end motor vehicle collision"
    - "prolonged computer work"
    - "a fall on an icy sidewalk"
    - "a weekend of yard work"
    - "sleeping in an awkward position"
  work_mechanism:
    - "lifting a heavy box at work"
    - "a fall from a ladder at work"
    - "a repetitive lifting task on the job"
  technique: ["diversified", "drop-table", "instrument-assisted"]
  goal_activity:
    - "full-time work without restriction"
    - "walking 30 minutes"
    - "sleeping through the night"
    - "lifting a grandchild"
    - "recreational cycling"
  new_complaint: ["right shoulder", "left knee", "right hip", "left elbow", "right wrist"]

# Encounter templates: what a chiropractic visit log shows. Tags are what scenarios require
# (`follow_up`: an established patient's visit within a plan of care; `established_em`: an
# established patient's E/M with CMT; `new_patient`: the initial examination). An E/M is present
# with em_probability (scenarios can force it); a procedure slot is present with probability.
# Diagnosis group 1 holds the subluxation levels, group 2 the related neuromusculoskeletal
# conditions, group 3 an extremity condition where one applies. The CMT slot pairs groups 1 and 2
# by region (`pair_regions`, at most two pairs); an X-ray slot matches a treated region
# (`match_regions`); a therapy line points to the condition of the first pair and draws an exercise
# text for that region; extremity lines point to group 3.
encounters:
  - id: initial_exam_with_xrays
    weight: 10
    tags: [em_plus_cmt, has_em, has_cmt, has_xray, initial_visit, new_patient]
    em_codes: ["99203", "99204"]
    em_probability: 1.0
    em_modifier_25: true
    procedures:
      - {codes: ["98940", "98941"], dx_groups: [1, 2], pair_regions: true}
      - {codes: ["72040", "72070", "72100"], dx_groups: [2], match_regions: true}
    diagnosis_groups:
      - ["M99.01", "M99.02", "M99.03", "M99.05"]
      - ["M54.2", "M47.812", "M50.30", "M54.6", "M54.50", "M47.816", "M51.360"]
  - id: re_examination_visit
    weight: 8
    tags: [em_plus_cmt, has_em, has_cmt, re_exam, follow_up, established_em]
    em_codes: ["99213", "99214"]
    em_probability: 1.0
    em_modifier_25: true
    procedures:
      - {codes: ["98940", "98941", "98942"], dx_groups: [1, 2], pair_regions: true}
      - {codes: ["97110"], probability: 0.5, dx_groups: [2]}
    diagnosis_groups:

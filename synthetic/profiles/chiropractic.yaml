      - >-
        Procedure note: {cmt_description} ({cmt_code}), {cmt_detail}. The pre-manipulation
        assessment of the regions already under care is part of the manipulation; the evaluation of
        the new complaint above was performed and documented separately.
    letter: >-
      The evaluation and management service on line {line_number} ({line_code}) was billed on the
      same date as chiropractic manipulative treatment ({cmt_code}) without the modifier that
      identifies it as a significant, separately identifiable service. {carc_quote} {rarc_quote}

  - id: duplicate_exact
    description: The whole claim duplicates a claim already processed (documented, 18/N522; Group OA for every payer, as the X12 usage note for CARC 18 requires).
    category: duplicate
    expected_action: no_action
    weight: 5
    carc: "18"
    rarcs: ["N522"]
    group: OA
    level: claim
    letter: >-

        ({line_code}), {units} unit(s): {line_detail}. Performed after {cmt_description},
        {cmt_detail}. Response: tolerated well; the home exercise program was reviewed.
      - >-
        Plan of care: therapeutic procedures and modalities ({therapy_code}) {plan_frequency} for
        {plan_weeks} weeks, supervised one-on-one by the treating chiropractor, with the minutes

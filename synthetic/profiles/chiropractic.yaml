    note_count: [2, 2]
    notes:
      - >-
        Two separate encounters on {service_date}. Morning visit: {cmt_description} ({cmt_code}),
        {cmt_detail}, for {diagnosis} ({diagnosis_code}). The patient returned at 4:30 pm after a
        fall at home with a new acute exacerbation at {site}; a second, separate examination was
        performed and the spinal manipulation was repeated.
      - >-
        Afternoon encounter documented separately: pain {pain_initial}/10 at {site} after the fall,
        {lesion}; repeat {cmt_description} with {technique} technique, billed as a second line.
    letter: >-
      The service on line {line_number} ({procedure_code}) duplicates a service already paid on this
      claim for the same date. {carc_quote} {rarc_quote}

  - id: timely_filing_expired
    description: Claim submitted well after the payer's filing window; nothing to recover (documented, 29).

# Synthetic specialty profile: chiropractic, the specialty chosen for the pilot on 2026-10-29
# (docs/SPECIALTY.md lists the payer mix, the denial patterns with their sources and the
# assumptions the certified coder confirms). Everything here is fictional: the fee schedule is
# invented, the payers, addresses and identifiers do not exist, and the clinic and provider NPIs
# pass the check digit and had no record in the CMS NPPES registry when they were checked on
# 2026-10-30 (the check digit alone cannot tell an unassigned NPI from a real one, so every new
# synthetic NPI is looked up first; synthetic/README.md, "Rules").
#
# Loaded by synthetic/profile.py into a Profile dataclass. Templates (notes, letters) use {placeholders}
# that synthetic/generate.py fills per claim; the full placeholder list is in synthetic/README.md.
# Letters and notes deliberately contain no phone numbers or e-mail addresses: the redaction scanner
# treats those as generic identifiers and would refuse to send a prompt that carries them.
#
# Payer billing rules are data: `kind_modifiers` (the modifiers every line of a kind carries for that
# payer), `noncovered` (line kinds the payer never pays, denied with an informational CAS that creates
# no work item), `excluded_kinds` (line kinds the clinic does not bill to that payer), `code_map`
# (codes the payer wants in place of others), `age_bands` (the patients' ages), `sequestration_rate`
# (CO-253 on paid lines), `ordering_provider_kinds` (line kinds whose claims carry the ordering
# provider) and `letters` (the payer's own letter paragraphs). Scenarios name the payers they are
# realistic for (`requires_payers`).
#
# Regions: every diagnosis and every CMT detail names its spinal (or extremity) region, and the CMT
# slot of each encounter pairs the diagnoses by region (`pair_regions`): one subluxation level and the
# condition of the same region per treated region, two pairs at most (a service line points to four
# diagnoses at most, CMS-1500 Item 24E, so for 3-5 regions the two most pertinent pairs go on the line
# and the record holds the rest). The
# segment a note names for a level is the segment the CMT detail says was adjusted there.


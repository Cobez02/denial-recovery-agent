# Alembic configuration for the Denial Recovery Agent.
#
# The database URL is deliberately left blank here: app/migrations/env.py reads DATABASE_URL
# through app.config.Settings (and resolves relative SQLite paths against the project root), so
# the same migration files serve SQLite locally/in tests and PostgreSQL 16 in Docker.

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

# Logging configuration (used only when the process has not configured logging already).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

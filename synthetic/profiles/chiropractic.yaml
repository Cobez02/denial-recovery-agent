      - >-
        Manual therapy ({therapy_code}), {units} unit(s): {line_detail}, performed on the {site} for
        {diagnosis} ({diagnosis_code}), a separate region that was not manipulated today. Spinal
        manipulation ({cmt_code}): {cmt_detail}.
      - >-
        Two distinct services in different anatomic regions: the spinal regions received
        {cmt_description} and the {site} received manual therapy for a separate extremity condition,
        with the minutes and the technique recorded for the timed service.
    letter: >-
      Payment for {procedure_code} on line {line_number} is included in the allowance for
      {other_procedure_code} performed on the same date. {carc_quote} {rarc_quote}

  - id: bundling_97140_same_region
    description: Manual therapy in a spinal region that received CMT is never separately reportable; nothing in the notes says otherwise (documented, 236/N20).
    category: bundling
    expected_action: no_action
    weight: 5
    carc: "236"
    rarcs: ["N20"]
    group: CO
    level: line
    target: {codes: ["97140"]}
    requires_tags: [manual_therapy_same_region]
    requires_payers: [GPMA2, SWPPO3]
    allow_benign_notes: false
    letter: >-
      {procedure_code} on line {line_number} is not separately payable with {other_procedure_code} on
      the same date of service under National Correct Coding Initiative edits when it is performed in
      a spinal region that received manipulation. {carc_quote} {rarc_quote}

  - id: cob_other_coverage_primary
    description: The payer believes another plan is primary and needs the primary EOB; Medicaid is the payer of last resort (typical, 22/N4).
    category: coordination_of_benefits
    expected_action: clinic_question
    weight: 4
    carc: "22"
    rarcs: ["N4"]
    group: CO
    level: claim
    requires_payers: [GPMA2, SWPPO3, TLMC4]
    letter: >-
      Our records indicate the member has other coverage that is primary for this date of service.
      {carc_quote} {rarc_quote} Submit the primary carrier's explanation of benefits for secondary
      consideration.

  - id: cob_medicare_secondary_payer
    description: Medicare's records show other coverage (an employer group health plan) is primary for the date of service (documented, Noridian 22/N598).
    category: coordination_of_benefits
    expected_action: clinic_question
    weight: 3
    carc: "22"
    rarcs: ["N598"]
    group: CO
    level: claim
    requires_payers: [GBMB1]
    letter: >-
      Medicare records show that other health care coverage is primary to Medicare for the
      beneficiary on the date of service. {carc_quote} {rarc_quote} The primary payer's adjudication
      must accompany any claim to Medicare, and the beneficiary may update the coordination of
      benefits record if Medicare is in fact primary.

  - id: cob_misrouted_wrong_payer
    description: Claim sent to the wrong plan; the letter names the responsible plan (typical, 109/N418).
    category: coordination_of_benefits
    expected_action: corrected_claim
    weight: 3
    carc: "109"
    rarcs: ["N418"]
    group: CO
    level: claim
    letter_required: true
    letter: >-
      This claim was sent to the wrong plan. This member's coverage for the date of service is
      administered by {other_payer_name}, not by {payer_name}. {carc_quote} {rarc_quote} Please
      submit the claim to {other_payer_name} for processing.

  - id: cob_work_injury_liability
    description: An injury diagnosis with a work accident; the health plan says the workers' compensation carrier is liable (documented, 19/N418).
    category: coordination_of_benefits
    expected_action: clinic_question
    weight: 4
    carc: "19"
    rarcs: ["N418"]
    group: CO
    level: claim
    requires_tags: [injury]
    requires_payers: [SWPPO3]
    note_count: [1, 1]
    notes:
      - >-
        History: {first_name} {last_name} reports the onset of neck and back pain on {onset_date}
        after {work_mechanism}; today's findings include {lesion} at {site}. The injury intake form
        records the circumstances of the incident, and the employer's claim number, if one exists, is
        kept in the chart.
    letter: >-
      The diagnosis and the accident information on this claim indicate a work-related injury.
      {carc_quote} {rarc_quote} This plan is not liable for care related to an injury that arose out
      of employment; bill the workers' compensation carrier, or submit that carrier's denial for
      reconsideration.

  - id: missing_initial_treatment_date
    description: Chiropractic claim returned as unprocessable without the initial treatment date (Item 14 / DTP*454); no appeal rights (documented, 16/MA122 MA130).
    category: missing_information
    expected_action: clinic_question
    weight: 5
    carc: "16"
    rarcs: ["MA122", "MA130"]
    group: CO
    level: claim
    requires_tags: [follow_up]
    requires_payers: [GBMB1, GPMA2]
    no_appeal_rights: true
    note_count: [1, 1]
    notes:
      - >-
        Initial treatment date for this episode of care: {initial_treatment_date} (the date of the
        initial examination). The date was omitted from the claim by the billing software and must be
        reported on a new claim.
    letter: >-
      {carc_quote} {rarc_quote} The date of initiation of the course of treatment (CMS-1500 Item 14
      or 837P DTP*454) is required on every claim for chiropractic manipulative treatment.

  - id: missing_ordering_provider_xray
    description: An X-ray line from the chiropractor sent without the ordering provider's name and NPI; the note says the treating chiropractor ordered the films (documented, 16/N264 N265).
    category: missing_information
    expected_action: corrected_claim
    weight: 2
    carc: "16"
    rarcs: ["N264", "N265"]
    group: CO
    level: line
    target: {kinds: [xray]}
    requires_tags: [has_xray]
    requires_payers: [GBMB1]
    claim_setup: {referring_provider: absent}
    note_count: [1, 1]
    notes:
      - >-
        Radiographs ({xray_code}, {xray_detail}) were ordered by the treating chiropractor and taken in
        the office on {service_date} to document the subluxation; the ordering provider is the
        rendering chiropractor.
    letter: >-
      The radiology service on line {line_number} ({procedure_code}) was submitted without the
      ordering provider's name and identifier. {carc_quote} {rarc_quote} Resubmit with the ordering
      provider information.

  - id: missing_records_not_received
    description: The utilization-management vendor asked for the treatment notes and denied for lack of information (typical, 226/N706).
    category: missing_information
    expected_action: clinic_question
    weight: 4
    carc: "226"
    rarcs: ["N706"]
    group: CO
    level: claim
    requires_payers: [GPMA2, SWPPO3]
    letter: >-
      The clinical documentation requested for this episode of care was not received by the review
      deadline. {carc_quote} {rarc_quote} Submit the initial evaluation, the treatment plan and the
      daily notes with a copy of this notice.

  - id: contractual_gz_maintenance
    description: Maintenance CMT billed with GZ (no ABN) is auto-denied with the provider liable; nothing to appeal (documented, 50 with no RARC).
    category: contractual
    expected_action: no_action
    weight: 2
    carc: "50"
    rarcs: []
    group: CO
    level: line
    target: {kinds: [cmt]}
    requires_tags: [cmt_only]
    requires_payers: [GBMB1]
    claim_setup: {set_target_modifiers: ["GZ"]}
    note_count: [1, 1]
    notes:
      - >-
        Supportive care visit: {first_name} {last_name} is clinically stable with {diagnosis}
        ({diagnosis_code}); findings unchanged since the last visit and no further objective
        improvement is expected. No Advance Beneficiary Notice was obtained before the visit; the
        service is reported with modifier GZ and the charge cannot be billed to the patient.
    letter: >-
      {carc_quote} The service on line {line_number} ({procedure_code}) was billed with modifier GZ,
      which indicates that the provider expected the item to be denied as not reasonable and
      necessary and that no Advance Beneficiary Notice is on file. The provider is liable for the
      charge.

  - id: pr_xray_without_gy
    description: An X-ray by a chiropractor billed without GY denies as a provider-type exclusion with the patient liable (documented, PR-170; N95 the usual remark).
    category: patient_responsibility
    expected_action: no_action
    weight: 3
    carc: "170"
    rarcs: ["N95"]
    group: PR
    level: line
    target: {kinds: [xray]}
    requires_tags: [has_xray]
    requires_payers: [GBMB1]
    claim_setup: {strip_target_modifiers: [GY]}
    note_count: [1, 1]
    notes:
      - >-
        Radiographs ({xray_code}, {xray_detail}) taken at the initial examination to document the
        subluxation. X-rays taken by a chiropractor are not a Medicare benefit; the patient was
        informed in writing before the films were taken that the charge is their responsibility.
    letter: >-
      The radiology service on line {line_number} ({procedure_code}) is not payable when performed
      and billed by this provider type; the beneficiary is responsible for the charge. {carc_quote}
      {rarc_quote}

  - id: other_ppo_visit_limit
    description: The plan's chiropractic visit maximum for the calendar year has been reached; the clinic's visit log disagrees with the accumulator (documented, 119/N587).
    category: other
    expected_action: clinic_question
    weight: 9
    carc: "119"
    rarcs: ["N587"]
    group: CO
    level: line
    target: {kinds: [cmt]}
    requires_tags: [follow_up]
    requires_payers: [SWPPO3]
    note_count: [1, 1]
    notes:
      - >-
        Billing note: the plan's chiropractic benefit allows 20 visits per calendar year; the clinic's
        visit log shows this is visit {year_visit_count} of the year for this member, so the plan's
        accumulator should be verified before any balance is billed to the patient.
    letter: >-
      The chiropractic benefit maximum of 20 visits per calendar year has been reached for this
      member. {carc_quote} {rarc_quote} Visits beyond the benefit maximum are not payable under the
      member's plan.

# Paraphrased public CARC/RARC descriptions used in letters (app/classify/codes.yaml is the catalog
# the classifier cites; these are only for the synthetic payer letters).
code_texts:
  "1": "Deductible amount."
  "2": "Coinsurance amount."
  "3": "Co-payment amount."
  "4": "The procedure code is inconsistent with the modifier used, or a required modifier is missing."
  "11": "The diagnosis is inconsistent with the procedure."
  "16": "Claim/service lacks information or has submission/billing error(s) which is needed for adjudication."
  "18": "Exact duplicate claim/service."
  "19": "This is a work-related injury/illness and thus the liability of the Worker's Compensation Carrier."
  "22": "This care may be covered by another payer per coordination of benefits."
  "24": "Charges are covered under a capitation agreement/managed care plan."
  "27": "Expenses incurred after coverage terminated."
  "29": "The time limit for filing has expired."
  "45": "Charge exceeds fee schedule/maximum allowable or contracted/legislated fee arrangement."
  "50": "These are non-covered services because this is not deemed a medical necessity by the payer."
  "96": "Non-covered charge(s)."
  "97": "The benefit for this service is included in the payment/allowance for another service/procedure that has already been adjudicated."
  "109": "Claim/service not covered by this payer/contractor. You must send the claim/service to the correct payer/contractor."
  "119": "Benefit maximum for this time period or occurrence has been reached."
  "170": "Payment is denied when performed/billed by this type of provider."
  "197": "Precertification/authorization/notification/pre-treatment absent."
  "226": "Information requested from the Billing/Rendering Provider was not provided or not provided timely or was insufficient/incomplete."
  "236": "This procedure or procedure/modifier combination is not compatible with another procedure or procedure/modifier combination provided on the same day according to the National Correct Coding Initiative or workers compensation state regulations/fee schedule requirements."
  "253": "Sequestration - reduction in federal payment."
  "M15": "Separately billed services/tests have been bundled as they are considered components of the same procedure. Separate payment is not allowed."
  "M62": "Missing/incomplete/invalid treatment authorization code."
  "M86": "Service denied because payment already made for same/similar procedure within set time frame."
  "MA122": "Missing/incomplete/invalid initial treatment date."
  "MA130": "Your claim contains incomplete and/or invalid information, and no appeal rights are afforded because the claim is unprocessable. Please submit a new claim with the complete/correct information."
  "N4": "Missing/Incomplete/Invalid prior Insurance Carrier(s) EOB."
  "N10": "Adjustment based on the findings of a review organization/professional consult/manual adjudication/medical advisor/dental advisor/peer review."
  "N20": "Service not payable with other service rendered on the same date."
  "N30": "Patient ineligible for this service."
  "N54": "Claim information is inconsistent with pre-certified/authorized services."
  "N95": "This provider type/provider specialty may not bill this service."
  "N115": "This decision was based on a Local Coverage Determination (LCD). An LCD provides a guide to assist in determining whether a particular item or service is covered."
  "N264": "Missing/incomplete/invalid ordering provider name."
  "N265": "Missing/incomplete/invalid ordering provider primary identifier."
  "N418": "Misrouted claim. See the payer's claim submission instructions."
  "N425": "Statutorily excluded service(s)."
  "N522": "Duplicate of a claim processed, or to be processed, as a crossover claim."
  "N587": "Policy benefits have been exhausted."
  "N598": "Health care policy coverage is primary."
  "N626": "New or established patient E/M codes are not payable with chiropractic care codes."
  "N640": "Exceeds number/frequency approved/allowed within time period."
  "N657": "This should be billed with the appropriate code for these services."
  "N706": "Missing documentation."
  "N822": "Missing procedure modifier(s)."

# Notes attached to ~30% of claims that have no scenario-specific documentation. They fit any visit
# (an initial examination included) and document nothing a playbook could mistake for a fix.
benign_notes:
  - >-
    Patient tolerated the adjustment well. Home stretching program reviewed; return as scheduled.
  - >-
    {diagnosis} ({diagnosis_code}) treated today: {cmt_description}, {cmt_detail}.
  - >-
    Ice applied for 10 minutes after treatment. Posture and workstation advice reviewed; the patient
    verbalized understanding.
  - >-
    {first_name} {last_name} reports pain {pain_now}/10 after today's treatment and no new concerns.
  - >-
    Patient advised to keep the home exercise log and to bring it to the next visit.
  - >-
    Phone note: the patient asked about the visit schedule; the front desk confirmed the next
    appointment.

letters:
  letter_rate: 0.40
  portal_rate: 0.20
  letter_template: |
    {payer_name}
    Claims Review Department
    {payer_address_line1}
    {payer_city}, {payer_state} {payer_zip}

    {letter_date}

    {clinic_name}
    Attn: Billing Office

    RE: Notice of claim determination
    Claim number: {claim_control_number}
    Payer claim number: {payer_claim_control_number}
    Member: {patient_last_name}, {patient_first_name}
    Member ID: {member_id}
    Date of birth: {dob_mdy}
    Date of service: {service_date}
    Rendering provider: {provider}
    Billed amount: ${total_charge}

    Dear Provider,

    {body}

    {appeal_paragraph}

    Sincerely,
    Claims Review Department
    {payer_name}
  portal_template: |
    CLAIM STATUS - {payer_name} provider portal
    Claim: {claim_control_number} | Payer reference: {payer_claim_control_number}
    Member: {patient_first_name} {patient_last_name} | ID {member_id} | DOB {dob_mdy}
    Date of service: {service_date} | Billed: ${total_charge} | Paid: ${paid_total}
    Status: {status_word}
    Reason: {carc} - {carc_text}
    {rarc_lines}
    Notes: {body}
    {appeal_paragraph}
  appeal_rights: >-
    If you disagree with this determination you may submit a written appeal within {appeal_days}
    days of the date of this notice. Include the claim number, a copy of this notice and the
    supporting clinical documentation.
  corrected_claim_rights: >-
    A corrected claim (frequency code 7) referencing the original claim number must be received
    within {corrected_claim_days} days of the date of this notice. Written appeals may be submitted
    within {appeal_days} days.
  no_appeal_rights: >-
    No appeal rights are afforded for this determination because the claim is unprocessable. Submit a
    new claim with complete and correct information.

      - >-
        Segments manipulated today ({cmt_code}, {technique} technique): {cmt_detail}. Assessment:
        measurable functional improvement toward the plan goals; continued active treatment is
        medically necessary and expected to produce further improvement.
    letter: >-
      The spinal manipulation on line {line_number} ({procedure_code}) was reviewed against the
      local coverage determination and was found to be maintenance therapy based on the records
      submitted. {carc_quote} {rarc_quote}

